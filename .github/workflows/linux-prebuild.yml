name: Linux prebuild

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-prebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm guard
          pnpm typecheck
          pnpm --filter @open-design/web test tests/runtime/cms-host-release-fingerprint.test.ts

      - name: Build portable AppImage
        run: >-
          pnpm tools-pack linux build
          --to appimage --portable
          --namespace linux-prebuild
          --dir "$RUNNER_TEMP/open-design-pack"

      - name: Prepare download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-artifact
          mapfile -d '' images < <(find "$RUNNER_TEMP/open-design-pack" -type f -name '*.AppImage' -print0)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected one AppImage, found ${#images[@]}" >&2
            exit 1
          fi
          cp "${images[0]}" linux-artifact/OpenDesign-linux-x86_64.AppImage
          cp tools/pack/resources/linux/icon.png linux-artifact/open-design.png
          git rev-parse HEAD > linux-artifact/COMMIT.txt
          cd linux-artifact
          sha256sum OpenDesign-linux-x86_64.AppImage open-design.png COMMIT.txt > SHA256SUMS

      - name: Verify packaged startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/open-design-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/linux-artifact/OpenDesign-linux-x86_64.AppImage" --appimage-extract > /dev/null
          app_root="$smoke_dir/squashfs-root"
          export OD_RESOURCE_ROOT="$app_root/resources/open-design"
          export OD_PACKAGED_NAMESPACE=linux-prebuild-smoke
          "$OD_RESOURCE_ROOT/bin/node" "$app_root/resources/app/node_modules/@open-design/packaged/dist/headless.mjs" > runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..120}; do
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat runtime.log
              exit 1
            fi
            url="$(rg -o 'http://127\.0\.0\.1:[0-9]+' runtime.log | tail -1 || true)"
            if [ -n "$url" ] && curl -fsS "$url/api/health" > health.json; then
              curl -fsS "$url" > home.html
              rg -q '<html' home.html
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat runtime.log
            exit 1
          fi
          cat health.json

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-design-linux-x86_64
          path: linux-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
